<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayzle</title>
<meta name="description" content="Dayzle – an Android app by Akansha Sharma.">
<style>
  :root { --bg:#f7f8fb; --card:#ffffff; --text:#1d2330; --muted:#5b6475; --accent:#4f46e5; --line:#e5e8ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1b1e26; --text:#eceef3; --muted:#a3aabb; --accent:#8b85ff; --line:#2a2e39; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; }
  h1 { margin:0 0 4px; font-size:2.2rem; }
  .by { color:var(--muted); margin:0 0 24px; }
  p { margin:0 0 16px; }
  a { color:var(--accent); }
  nav { display:flex; gap:20px; flex-wrap:wrap; margin-top:24px; padding-top:20px; border-top:1px solid var(--line); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; margin-top:24px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Dayzle</h1>
    <p class="by">An Android app by Akansha Sharma</p>
    <p>Welcome to the official page for Dayzle. Dayzle is available for Android devices.</p>
    <p>For questions, feedback or support, email <a href="mailto:akansha.sharma18395@gmail.com">akansha.sharma18395@gmail.com</a>.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="mailto:akansha.sharma18395@gmail.com">Contact</a>
    </nav>
  </div>
  <footer>&copy; 2026 Akansha Sharma</footer>
</main>
</body>
</html>
